          - rowgroup [ref=e246]:
            - row "SeaOS SeaOS is a hybrid kernel with loadable modules that supports ATA, AHCI, EXT2, ELF, and many other fancy acronyms. It has basic networking support, initial VT-x support, and is self-hosting with a fairly complete unix-like userland. Designed for simplicity. Icon phone.png Daniel Bittman (danielbittman1 at gmail.com) Icon license.png No License Information Icon site.png http://dbittman.github.io/seaos Icon floppy.png Unknown Icon clock.png Inactive (2016)" [ref=e247]:
              - cell "SeaOS SeaOS is a hybrid kernel with loadable modules that supports ATA, AHCI, EXT2, ELF, and many other fancy acronyms. It has basic networking support, initial VT-x support, and is self-hosting with a fairly complete unix-like userland. Designed for simplicity." [ref=e248]:
