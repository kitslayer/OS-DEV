                - heading "RDOS" [level=2] [ref=e223]
                - paragraph [ref=e224]: 32-bit segmented operating system for 386 or higher processors. Support for USB (UHCI, OHCI, EHCI, XHCI) and USB 2 hubs, IDE and AHCI for discs, RTL8139 and RTL8169 for networks, and HD audio. It boots with EFI using GPT and BIOS using BIOS disc formats and supports FAT12, FAT16, and FAT32 filesystems. Supports both older CPUs with PIC & PIT and newer with APIC which also includes support for multicore operation. It has a full libc in the OpenWatcom project. OpenWatcom supports building segmented kernel drivers, and 32-bit flat applications, libraries, and DLLs. It has a command-line originally ported from FreeDos, and a GUI the includes widgets for labels, buttons, list boxes, and images (supporting PNG, JPEG, and BMP formats). In the debugging area, it supports remote debugging over TCP/IP from Windows using OpenWatcoms debugger that also can trace into the kernel, a kernel debugger, and a crash debugger. It runs on several thousand commercial installations as a controller and as a payment terminal.
              - cell "Icon phone.png Leif Ekblad (leif at rdos.net) Icon license.png No License Information Icon site.png http://www.rdos.net/rdos/ Icon floppy.png Unknown Icon clock.png Active" [ref=e225]:
