        - table [ref=e18]:
          - rowgroup [ref=e19]:
            - row "BareMetal BareMetal is a 64-bit OS for x86-64 based computers. The OS is written entirely in Assembly while applications can be written in Assembly or C/C++. The two main purposes of BareMetal are for educational uses in learning low-level OS programming in 64-bit Assembly and to be used as a base for a high-speed data processing node. Source code is well documented and freely available. As of version 2026.01 BareMetal officially supports multiple processors, memory management, and Ethernet communication. Icon phone.png Ian Seyler (ian.seyler at returninfinity.com) Icon license.png Open source (MIT) Icon site.png http://www.returninfinity.com/ Icon floppy.png Unknown Icon clock.png Active" [ref=e20]:
