                    - /url: https://wikipedia.org/wiki/TempleOS
                - paragraph [ref=e403]: "TempleOS is a 64 bit lightweight OS with multitasking and multicore support, which is ring-0-only and works in a single address space. It provides the interface for communicating with God: the user has to choose a random number from the constantly changing sequences and then it is converted to the text interpretation. Whole OS with its' software has been single-handedly created during 15 years by Terry A Davis - who also developed a programming language called Holy C together with a special compiler for it. TempleOS supports the FAT32 and RedSea filesystems (the latter created by Terry) and also the file compression. It doesn't support the networking, partially for ideological reasons, but there are forks available with added functionality"
