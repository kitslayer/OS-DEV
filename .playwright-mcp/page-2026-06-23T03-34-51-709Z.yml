            - row "Pedigree Monolithic OS with several backends supported - x86, x64, MIPS32, ARM and PowerPC. Kernel written in C++ with the obvious bits of ASM. Offers a reasonable amount of POSIX support and a tiling GUI and can run Apache, DOSBox, and various other common programs. Planned to also offer a native API alongside POSIX for Pedigree-specific applications. Icon phone.png JamesM, bluecode, pcmattman, IRC freenode.net#pedigree Icon license.png No License Information Icon site.png http://www.pedigree-project.org/ Icon floppy.png Unknown Icon clock.png Discontinued" [ref=e193]:
