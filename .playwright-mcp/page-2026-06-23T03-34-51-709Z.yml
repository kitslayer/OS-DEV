        - table [ref=e131]:
          - rowgroup [ref=e132]:
            - row "Managarm-demo.png Managarm Managarm is a 64-bit OS for x86-64. It’s written in C++ with a custom libc and a GNU like userland on top. Managarm’s main purpose is aiming for Linux compatibility while being completely asynchronous in terms of I/O. The OS is capable of running Weston and kmscon while effort is made into porting (a subset of) Xorg. Furthermore, Managarm supports many modern hardware devices, including USB 3 and has nearly full ACPI support. Icon phone.png The official Managarm Discord server https://discord.gg/7WB6Ur3 Icon license.png Open source (MIT) Icon site.png http://www.managarm.org Icon floppy.png Unknown Icon clock.png Active" [ref=e133]:
