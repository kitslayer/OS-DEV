            - row "GloireJWM.png Ironclad Ironclad is a mostly formally verified hard real-time kernel written in SPARK and Ada. It is made to be 100% free software, free in the sense that it respects the user's freedom. It supports several architectures and features an advanced security model with features like Mandatory Access Control (MAC). The screenshot features Gloire, a distribution of Ironclad. Icon phone.png streaksu@ironclad-os.org Icon license.png GNU GPLv3 Icon site.png https://ironclad-os.org/ Icon floppy.png Unknown Icon clock.png Active" [ref=e78]:
