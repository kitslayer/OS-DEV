          - rowgroup [ref=e163]:
            - row "MikeOS.png MikeOS MikeOS is an operating system for x86 PCs, written in assembly language. It is a learning tool to show how simple 16-bit, real-mode OSes work, with well-commented code and extensive documentation. It has a BASIC interpreter with 46 instructions, supports over 60 syscalls, could manage a serial terminal connection and output the sound through PC speaker. There is also a file manager, text editor, image viewer and some games Icon phone.png Mike Saunders, okachi [at] gmail [dot] com Icon license.png Open source Icon site.png http://mikeos.sourceforge.net/ Icon floppy.png Unknown Icon clock.png Discontinued" [ref=e164]:
