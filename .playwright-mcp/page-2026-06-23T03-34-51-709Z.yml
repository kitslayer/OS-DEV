        - table [ref=e362]:
          - rowgroup [ref=e363]:
            - row "Symbos.gif SymbOS SymbOS is a multitasking graphical OS for 8-bit computers using the Z80 CPU. It aims to bring a Windows 95-like experience to hardware from the 1980s, including binary software compatibility across a range of originally incompatible computers (Amstrad CPC/PCW/NC, MSX, Enterprise 128, and more). Both original hardware (printers, sound) and modern hobbyist expansions (FAT mass storage, networking) are supported through device drivers. A growing library of userspace applications have been written using Z80 assembly and two native development environments, the Quigs IDE and a self-hosting native C compiler. Icon phone.png Jörn Mika, http://www.prodatron.net/ Icon license.png Mixed open/closed source Icon site.png http://symbos.org/ Icon floppy.png Unknown Icon clock.png Active" [ref=e364]:
