      - generic [ref=e10]:
        - paragraph [ref=e11]: This page maintains a list of mature hobby operating system projects considered to be notable. A hobby operating system is considered notable if it made some considerable progress (e.g. has had a full release, is self-hosting, has been reported on outside of the hobby OSdev world, etc.) or if it has achieved such notability within the operating system development community as a useful answer to the question, "I want to see what kind of operating systems you guys have built". It should have a relatively stable kernel and drivers, and some userspace applications. They are usually written by the members of this community, but not limited to.
        - paragraph [ref=e12]:
          - text: Everyone is welcome to add their own projects to the regular
          - link "Projects" [ref=e13] [cursor=pointer]:
            - /url: /Projects
          - text: list of all hobbyist operating systems.
        - paragraph [ref=e14]:
          - text: More advanced and successful alternative operating systems are listed at
          - link "Advanced Projects" [ref=e15] [cursor=pointer]:
            - /url: /Advanced_Projects
          - text: page.
