        - table [ref=e459]:
          - rowgroup [ref=e460]:
            - row "Visopsys.png Visopsys Visopsys (VISual OPerating SYStem) is an alternative operating system for PC-compatible computers, written “from scratch”, and developed primarily by a single hobbyist programmer since 1997. Its primary \"useful feature\" is a reasonably functional partition management program - the ‘Disk Manager’, which can create, format, delete, resize, defragment, copy, and move partitions, and modify their attributes. It supports both DOS/MBR and UEFI partition tables. It can also copy hard disks, and has a simple and friendly graphical interface. A basic version can fit on a bootable floppy disk, or you can use the entire system from a ‘live’ CD/DVD Icon phone.png https://visopsys.org/about/ Icon license.png Open source (GNU GPLv2) Icon site.png http://visopsys.org/ Icon floppy.png Unknown Icon clock.png Active" [ref=e461]:
