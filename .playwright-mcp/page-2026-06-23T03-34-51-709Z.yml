            - 'row "Ghost-ui-preview.png Ghost OS A homemade operating system with a microkernel for the IA32 (x86) platform. The project is written in C++ and Assembly. Features: multiprocessor- & multitasking support, kernel API library, custom C library, ELF support, IPC (messages, signals, shared memory, pipes), VFS, window server & GUI with homemade toolkit, PS/2 keyboard & mouse driver, VESA video driver and more... Icon phone.png Max Schlüssel (lokoxe@gmail.com) Icon license.png GPLv3 Icon site.png https://ghostkernel.org/ Icon floppy.png Unknown Icon clock.png Active" [ref=e46]':
